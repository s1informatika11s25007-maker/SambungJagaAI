name: Keep Supabase Awake (24/7 Ping)

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep Supabase awake without wasting GitHub quota
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/keep-supabase-awake.yml'

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Supabase Health Check & Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qepfuqlnkofzfhfzahpr.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcGZ1cWxua29memZoZnphaHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODA0NTIsImV4cCI6MjEwODE1NjQ1Mn0.wB-NMe1S-ZihNdW8OjJxgh2JlaH10D1SV6tbWbAJS50' }}
        run: |
          echo "Executing lightweight keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rpc/list_demo_login_accounts")
          
          echo "Supabase Response Status Code: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -eq 200 ] || [ "${HTTP_STATUS}" -eq 201 ] || [ "${HTTP_STATUS}" -eq 204 ]; then
            echo "✅ Supabase project is active and responsive (HTTP ${HTTP_STATUS})."
          else
            echo "⚠️ Warning: Received response status HTTP ${HTTP_STATUS}."
            exit 1
          fi
