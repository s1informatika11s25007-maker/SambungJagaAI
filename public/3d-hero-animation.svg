<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#030712; border-radius: 20px; overflow: hidden;">
  <defs>
    <!-- Dark Cyber Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for 3D Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 3D Animations and Keyframes */
    @keyframes spin3D {
      0% { transform: rotateX(65deg) rotateZ(0deg); }
      100% { transform: rotateX(65deg) rotateZ(360deg); }
    }

    @keyframes spin3DReverse {
      0% { transform: rotateX(65deg) rotateZ(360deg); }
      100% { transform: rotateX(65deg) rotateZ(0deg); }
    }

    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotateY(-5deg); }
      50% { transform: translateY(-18px) rotateY(5deg); }
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(480px); }
    }

    @keyframes particleMove1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(120px, -180px) scale(0.2); opacity: 0; }
    }

    @keyframes particleMove2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(-140px, -150px) scale(0.2); opacity: 0; }
    }

    @keyframes nodePulse {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }

    /* Element Classes */
    .bg-grid { fill: url(#bgGlow); }
    .scan-line { animation: scanline 4s linear infinite; }
    .mascot-group { animation: float3D 4s ease-in-out infinite; transform-origin: 450px 220px; }
    .ring-1 { animation: spin3D 12s linear infinite; transform-origin: 450px 320px; }
    .ring-2 { animation: spin3DReverse 8s linear infinite; transform-origin: 450px 320px; }
    .ring-3 { animation: spin3D 18s linear infinite; transform-origin: 450px 320px; }
    .core-light { animation: pulseCore 3s ease-in-out infinite; transform-origin: 450px 220px; }
    .p1 { animation: particleMove1 3s ease-in infinite; }
    .p2 { animation: particleMove2 4s ease-in infinite 1s; }
    .node-card { animation: nodePulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Isometric Cyber Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M0,80 L900,80 M0,160 L900,160 M0,240 L900,240 M0,320 L900,320 M0,400 L900,400" />
    <path d="M150,0 L150,480 M300,0 L300,480 M450,0 L450,480 M600,0 L600,480 M750,0 L750,480" />
  </g>

  <!-- Core Ambient Light Beam -->
  <ellipse cx="450" cy="220" rx="220" ry="180" fill="url(#coreGlow)" />

  <!-- 3D Holographic Orbit Rings at Base -->
  <g class="ring-1">
    <ellipse cx="450" cy="320" rx="260" ry="260" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="20 10 40 10" filter="url(#glow)" />
    <circle cx="710" cy="320" r="8" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="190" cy="320" r="8" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <g class="ring-2">
    <ellipse cx="450" cy="320" rx="200" ry="200" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-dasharray="15 15 30 10" filter="url(#glow)"/>
    <circle cx="650" cy="320" r="6" fill="#c084fc" filter="url(#glow)"/>
  </g>

  <g class="ring-3">
    <ellipse cx="450" cy="320" rx="140" ry="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-dasharray="10 10" opacity="0.8"/>
  </g>

  <!-- 3D Mascot Floating Core -->
  <g class="mascot-group">
    <!-- Glowing Hologram Base Platform -->
    <ellipse cx="450" cy="310" rx="110" ry="30" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>
    <ellipse cx="450" cy="310" rx="70" ry="20" fill="#38bdf8" opacity="0.6" filter="url(#intenseGlow)"/>

    <!-- Central Robot Avatar / Mascot Symbol -->
    <g transform="translate(370, 110)">
      <!-- Robot Head Base -->
      <rect x="25" y="30" width="110" height="90" rx="30" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
      <!-- Robot Visor -->
      <rect x="40" y="55" width="80" height="35" rx="15" fill="#0284c7"/>
      <!-- Glowing 3D Eyes -->
      <circle cx="62" cy="72" r="8" fill="#00f2fe" class="core-light" filter="url(#intenseGlow)"/>
      <circle cx="98" cy="72" r="8" fill="#00f2fe" class="core-light" filter="url(#intenseGlow)"/>
      <!-- Robot Ears / Antennas -->
      <path d="M15,65 L25,65 M135,65 L145,65" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="10" cy="65" r="5" fill="#10b981" filter="url(#glow)"/>
      <circle cx="150" cy="65" r="5" fill="#10b981" filter="url(#glow)"/>
      <!-- Chest Core -->
      <path d="M50,125 L110,125 L95,160 L65,160 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="80" cy="142" r="10" fill="#38bdf8" class="core-light" filter="url(#intenseGlow)"/>
    </g>

    <!-- Floating Holographic Data Particles -->
    <circle cx="450" cy="220" r="4" fill="#00f2fe" class="p1" filter="url(#glow)"/>
    <circle cx="450" cy="220" r="5" fill="#10b981" class="p2" filter="url(#glow)"/>
  </g>

  <!-- 3D Node Cards Floating on Sides -->
  <!-- Left Top: P1 Obligation Kernel -->
  <g class="node-card" transform="translate(40, 60)">
    <rect width="210" height="60" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <circle cx="30" cy="30" r="14" fill="#0284c7"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">P1</text>
    <text x="55" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#38bdf8">Obligation Kernel</text>
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Bitemporal Ledger</text>
  </g>

  <!-- Left Bottom: P3 Epistemic Fact -->
  <g class="node-card" transform="translate(40, 350)">
    <rect width="210" height="60" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.95"/>
    <circle cx="30" cy="30" r="14" fill="#059669"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">P3</text>
    <text x="55" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#34d399">Epistemic Ledger</text>
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Fact Provenance</text>
  </g>

  <!-- Right Top: P6 Authority Envelope -->
  <g class="node-card" transform="translate(650, 60)">
    <rect width="210" height="60" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2" opacity="0.95"/>
    <circle cx="30" cy="30" r="14" fill="#be123c"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">P6</text>
    <text x="55" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#fb7185">Authority Envelope</text>
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Safeguard Gate (A0-A3)</text>
  </g>

  <!-- Right Bottom: P2 Evidence Verifier -->
  <g class="node-card" transform="translate(650, 350)">
    <rect width="210" height="60" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="2" opacity="0.95"/>
    <circle cx="30" cy="30" r="14" fill="#7e22ce"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">P2</text>
    <text x="55" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#c084fc">Evidence Verifier</text>
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Multi-Grade (E0-E3)</text>
  </g>

  <!-- Animated Cyber Laser Scanning Beam -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00f2fe" stroke-width="2" opacity="0.4" class="scan-line" filter="url(#glow)"/>
</svg>
