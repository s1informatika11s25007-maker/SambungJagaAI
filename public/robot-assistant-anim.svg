<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background: linear-gradient(135deg, #030712 0%, #0f172a 100%); border-radius: 20px;">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Intense Hologram Glow Filter -->
    <filter id="robotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="haloLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Continuous 3D/4D Animations */
    @keyframes robotFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(2deg); }
    }

    @keyframes haloPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 0.9; }
    }

    @keyframes eyePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      48% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.1; transform: scaleY(0.1); }
      52% { opacity: 1; transform: scale(1); }
    }

    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes beamFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .robot-main { animation: robotFloat 4s ease-in-out infinite; transform-origin: 450px 210px; }
    .halo-bg { animation: haloPulse 3s ease-in-out infinite; transform-origin: 450px 220px; }
    .robot-eye { animation: eyePulse 4s ease-in-out infinite; transform-origin: center; }
    .step-card { animation: cardFloat1 3.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: beamFlow 2s linear infinite; }
  </style>

  <!-- Dark Background Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,80 L 900,80 M 0,160 L 900,160 M 0,240 L 900,240 M 0,320 L 900,320 M 0,400 L 900,400" />
    <path d="M 150,0 L 150,460 M 300,0 L 300,460 M 450,0 L 450,460 M 600,0 L 600,460 M 750,0 L 750,460" />
  </g>

  <!-- Title Header inside Graphic -->
  <text x="450" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CARA KERJA SAMBUNGJAGA AI — ASISTEN PINTAR PERAWATAN LANSIA</text>
  <text x="450" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Menghubungkan Laporan, Tugas, Bukti, dan Serah Terima Shift dalam Satu Alur Mudah</text>

  <!-- Floating Hologram Light Halo behind Robot -->
  <ellipse cx="450" cy="220" rx="180" ry="140" fill="url(#haloLight)" class="halo-bg"/>

  <!-- Connecting Flow Lines -->
  <path d="M 230,130 Q 320,130 380,180" stroke="#38bdf8" stroke-width="2.5" fill="none" class="flow-line"/>
  <path d="M 230,330 Q 320,330 380,250" stroke="#10b981" stroke-width="2.5" fill="none" class="flow-line"/>
  <path d="M 520,180 Q 580,130 670,130" stroke="#fbbf24" stroke-width="2.5" fill="none" class="flow-line"/>
  <path d="M 520,250 Q 580,330 670,330" stroke="#c084fc" stroke-width="2.5" fill="none" class="flow-line"/>

  <!-- CENTER ROBOT MASCOT (3D ANIMATED) -->
  <g class="robot-main">
    <!-- Robot Shadow Base -->
    <ellipse cx="450" cy="310" rx="75" ry="18" fill="#000000" opacity="0.4"/>
    <ellipse cx="450" cy="310" rx="55" ry="12" fill="#38bdf8" opacity="0.3" filter="url(#softGlow)"/>

    <!-- Robot Ears / Antennas -->
    <rect x="375" y="150" width="12" height="24" rx="6" fill="#38bdf8"/>
    <circle cx="381" cy="145" r="6" fill="#00f2fe" filter="url(#softGlow)"/>
    <rect x="513" y="150" width="12" height="24" rx="6" fill="#38bdf8"/>
    <circle cx="519" cy="145" r="6" fill="#00f2fe" filter="url(#softGlow)"/>

    <!-- Robot Head -->
    <rect x="385" y="120" width="130" height="95" rx="32" fill="url(#robotBody)" stroke="#38bdf8" stroke-width="4" filter="url(#robotGlow)"/>

    <!-- Robot Visor Screen -->
    <rect x="402" y="142" width="96" height="42" rx="18" fill="#030712" stroke="#0284c7" stroke-width="2"/>

    <!-- Glowing 3D Visor Eyes -->
    <g class="robot-eye">
      <circle cx="430" cy="163" r="10" fill="#00f2fe" filter="url(#softGlow)"/>
      <circle cx="430" cy="163" r="4" fill="#ffffff"/>
      <circle cx="470" cy="163" r="10" fill="#00f2fe" filter="url(#softGlow)"/>
      <circle cx="470" cy="163" r="4" fill="#ffffff"/>
    </g>

    <!-- Friendly Smile Line -->
    <path d="M 438,175 Q 450,183 462,175" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Robot Body / Chest -->
    <path d="M 405,222 L 495,222 L 480,285 L 420,285 Z" fill="url(#robotBody)" stroke="#38bdf8" stroke-width="3"/>

    <!-- Chest Emblem Heart LED -->
    <circle cx="450" cy="250" r="12" fill="#0284c7"/>
    <path d="M 445,249 C 445,245 448,243 450,246 C 452,243 455,245 455,249 C 455,253 450,256 450,256 C 450,256 445,253 445,249 Z" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <!-- 4 FRIENDLY STEP CARDS -->

  <!-- STEP 1: Tangkap Laporan -->
  <g class="step-card" transform="translate(30, 95)">
    <rect width="200" height="80" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="12" y="15" width="32" height="32" rx="10" fill="#0284c7"/>
    <text x="28" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">1</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#38bdf8">Tangkap Laporan</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">🎙️ Suara, Teks &amp; Foto</text>
    <text x="52" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Pengasuh mudah mencatat</text>
  </g>

  <!-- STEP 2: Susun Tugas -->
  <g class="step-card" transform="translate(30, 290)" style="animation-delay: 0.8s;">
    <rect width="200" height="80" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="12" y="15" width="32" height="32" rx="10" fill="#059669"/>
    <text x="28" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">2</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#34d399">Susun Tugas</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">📋 Jadwal Otomatis</text>
    <text x="52" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Mencegah tugas terlewat</text>
  </g>

  <!-- STEP 3: Verifikasi Bukti -->
  <g class="step-card" transform="translate(670, 95)" style="animation-delay: 1.2s;">
    <rect width="200" height="80" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="12" y="15" width="32" height="32" rx="10" fill="#d97706"/>
    <text x="28" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">3</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#fbbf24">Verifikasi Bukti</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">📷 Foto &amp; QR Selesai</text>
    <text x="52" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Bukti aman terverifikasi</text>
  </g>

  <!-- STEP 4: Serah Terima Shift -->
  <g class="step-card" transform="translate(670, 290)" style="animation-delay: 1.8s;">
    <rect width="200" height="80" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="12" y="15" width="32" height="32" rx="10" fill="#7e22ce"/>
    <text x="28" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">4</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#c084fc">Serah Terima Shift</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">🤝 Operan Shift Rapi</text>
    <text x="52" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Informasi lansia tersambung</text>
  </g>

  <!-- Bottom Message Bar -->
  <rect x="180" y="405" width="540" height="38" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="429" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">✨ <tspan font-weight="800" fill="#38bdf8">SambungJaga AI</tspan>: Perawatan lansia lebih tenang, terorganisir, dan terpercaya.</text>
</svg>
